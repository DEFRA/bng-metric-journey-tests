################################################################################
# Override for the resilience tests (npm run test:resilience): routes the
# backend's Postgres, S3 and CDP Uploader connections and the frontend's Redis
# and backend connections through Toxiproxy, so a test can fail one of them
# without touching anything else in the stack.
#
# It also adds two services a test can point a proxy at: a backend that is
# always too busy to check files, and an uploader that never finishes scanning.
# The test-postgres and test-redis proxies give the tests their own way into
# Postgres and Redis, and are never faulted.
#
# Only those connections go through the proxy. The uploader and the identity stub
# keep their own Redis connections, the uploader keeps its own S3 and SQS
# connections, and the browser posts files to the uploader directly, so a fault
# only reaches the one service it is aimed at.
#
# Run:
#   docker compose -f compose.yml -f compose.resilience.yml up --wait -d
#   npm run test:resilience
#
# Put the normal stack back afterwards:
#   docker compose up --wait -d --remove-orphans
################################################################################
services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    networks:
      - bng-journey-tests
    command: ['-host=0.0.0.0', '-config=/config/proxies.json']
    volumes:
      - ./docker/toxiproxy/proxies.json:/config/proxies.json:ro
    ports:
      - '8474:8474'
      - '25432:25432'
      - '26379:26379'
    healthcheck:
      test: ['CMD', '/toxiproxy-cli', 'list']
      interval: 5s
      start_period: 2s
      retries: 5

  bng-metric-backend:
    environment:
      - DB_HOST=toxiproxy
      - DB_PORT=15432
      - S3_ENDPOINT=http://toxiproxy:14566
      - CDP_UPLOADER_URL=http://toxiproxy:17337
    # The backend exits at startup if it cannot reach Postgres, so the proxy has
    # to be serving before the backend starts.
    depends_on:
      toxiproxy:
        condition: service_healthy

  bng-metric-frontend:
    environment:
      # The Redis port is hardcoded to 6379 in the frontend's redis-client.js.
      - REDIS_HOST=toxiproxy
      - BACKEND_URL=http://toxiproxy:13001
    depends_on:
      toxiproxy:
        condition: service_healthy

  # Answers every file check with "busy", for the frontend's "service is busy"
  # message. Reached by pointing the backend proxy at it.
  bng-metric-backend-busy:
    extends:
      file: compose.yml
      service: bng-metric-backend
    environment:
      - VALIDATION_ADMISSION_LIMIT=0
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully

  # Reports every upload as still scanning, for the frontend's "file check timed
  # out" message. Reached by pointing the cdp-uploader proxy at it. Runs on the
  # uploader's own image, which already has Node.
  cdp-uploader-pending:
    image: defradigital/cdp-uploader:${CDP_UPLOADER_VERSION:-1.16.0@sha256:eb1627b60690ec24d41a17ed82e80c28d009aaaeb19dc179c6a3887da7e6a5bd}
    networks:
      - bng-journey-tests
    entrypoint: ['node', '/stub/pending-status.mjs']
    volumes:
      - ./docker/uploader-stub:/stub:ro
    depends_on:
      cdp-uploader:
        condition: service_healthy
