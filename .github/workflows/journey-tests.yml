name: Run Journey Tests on GitHub

permissions:
  checks: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      frontend-branch:
        description: Branch of bng-metric-frontend to build
        required: false
        default: main
      backend-branch:
        description: Branch of bng-metric-backend to build
        required: false
        default: main
      browser:
        description: Browser to run tests against
        required: false
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      profile:
        description: 'Tag filter (e.g. @smoke, @project-management). Leave blank to run all tests.'
        required: false
        default: ''
        type: string
      # The legacy run is off by default while the BNG Service template run is
      # built (BMD-1088), to keep CI short. Put the default back to both, here,
      # in workflow_call below and in the runs step, when that work is done.
      template-run:
        description: 'Which template run: service-template (SERVICE_TEMPLATE_ENABLED=true), legacy (false) or both'
        required: false
        default: service-template
        type: choice
        options:
          - service-template
          - both
          - legacy

  workflow_call:
    inputs:
      frontend-branch:
        required: false
        type: string
        default: main
      backend-branch:
        required: false
        type: string
        default: main
      browser:
        required: false
        type: string
        default: chromium
      profile:
        required: false
        type: string
        default: ''
      # service-template, both or legacy, as for workflow_dispatch.
      template-run:
        required: false
        type: string
        default: service-template

jobs:
  # Parses Depends-On lines from the PR body (workflow_call context).
  # Falls back to workflow_dispatch inputs when not triggered from a PR.
  parse-depends-on:
    name: Resolve branch dependencies
    runs-on: ubuntu-latest
    outputs:
      frontend-branch: ${{ steps.resolve.outputs.frontend-branch }}
      backend-branch: ${{ steps.resolve.outputs.backend-branch }}
      runs: ${{ steps.runs.outputs.matrix }}
    steps:
      # The run-tests matrix, from the template-run input. A PR, and a call
      # that does not set it, gets the service-template run only, for now (see
      # the input above). A caller passes it as free text, so anything else
      # fails here, before a stack is built.
      - name: Choose the template runs
        id: runs
        env:
          TEMPLATE_RUN: ${{ inputs.template-run || 'service-template' }}
        run: |
          legacy='{"run":"legacy","service-template":"false"}'
          service='{"run":"service-template","service-template":"true"}'
          case "$TEMPLATE_RUN" in
            both) runs="$legacy,$service" ;;
            legacy) runs="$legacy" ;;
            service-template) runs="$service" ;;
            *)
              echo "::error::template-run must be both, legacy or service-template, not '$TEMPLATE_RUN'"
              exit 1
              ;;
          esac
          echo "matrix={\"include\":[$runs]}" >> "$GITHUB_OUTPUT"
          echo "Template runs: $TEMPLATE_RUN"

      - name: Resolve branches from PR body or inputs
        id: resolve
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          INPUT_FRONTEND: ${{ inputs.frontend-branch || 'main' }}
          INPUT_BACKEND: ${{ inputs.backend-branch || 'main' }}
        run: |
          # Extract Depends-On lines, e.g.:
          #   Depends-On: DEFRA/bng-metric-frontend#feature/my-branch
          frontend_dep=$(echo "$PR_BODY" | grep -oP '(?<=Depends-On: DEFRA/bng-metric-frontend#)\S+' | head -1)
          backend_dep=$(echo "$PR_BODY" | grep -oP '(?<=Depends-On: DEFRA/bng-metric-backend#)\S+' | head -1)

          frontend_branch="${frontend_dep:-$INPUT_FRONTEND}"
          backend_branch="${backend_dep:-$INPUT_BACKEND}"

          echo "frontend-branch=$frontend_branch" >> "$GITHUB_OUTPUT"
          echo "backend-branch=$backend_branch" >> "$GITHUB_OUTPUT"

          echo "Resolved frontend branch: $frontend_branch"
          echo "Resolved backend branch:  $backend_branch"

  # One job for each state of the services' SERVICE_TEMPLATE_ENABLED flag,
  # each against its own stack started in that state: legacy with it off,
  # service-template with it on. For now only the service-template run is the
  # default, on every PR and call; the template-run input can ask for legacy
  # or both. The suite reads the same variable to
  # choose its Playwright project (test/utils/template-run.js), so setting it
  # on the job starts the stack and picks the run together. fail-fast is off
  # so one run failing never cancels the other.
  run-tests:
    name: Run Journey Tests (${{ matrix.run }})
    runs-on: ubuntu-latest
    needs: parse-depends-on
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.parse-depends-on.outputs.runs) }}
    env:
      BROWSER: ${{ inputs.browser || 'chromium' }}
      SERVICE_TEMPLATE_ENABLED: ${{ matrix.service-template }}
    steps:
      # Pinned explicitly so this workflow can be called from another repo.
      # A bare checkout resolves to github.repository, which in a cross-repo
      # workflow_call is the *calling* service repo, not the test suite.
      # Called from within this repo, github.ref is still the PR's own ref
      # (refs/pull/N/merge, or the queue ref on merge_group), so journey-tests
      # PRs keep testing their own changes rather than main.
      - name: Check out journey-tests
        uses: actions/checkout@v7.0.1
        with:
          repository: DEFRA/bng-metric-journey-tests
          ref: ${{ github.repository == 'DEFRA/bng-metric-journey-tests' && github.ref || 'main' }}

      - name: Check out bng-metric-frontend
        uses: actions/checkout@v7.0.1
        with:
          repository: DEFRA/bng-metric-frontend
          ref: ${{ needs.parse-depends-on.outputs.frontend-branch }}
          path: bng-metric-frontend

      - name: Check out bng-metric-backend
        uses: actions/checkout@v7.0.1
        with:
          repository: DEFRA/bng-metric-backend
          ref: ${{ needs.parse-depends-on.outputs.backend-branch }}
          path: bng-metric-backend

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ inputs.browser || 'chromium' }}

      - name: Build frontend image
        run: |
          docker build \
            --platform linux/amd64 \
            -t defradigital/bng-metric-frontend:${{ github.sha }} \
            ./bng-metric-frontend

      - name: Build backend image
        run: |
          docker build \
            --platform linux/amd64 \
            -t defradigital/bng-metric-backend:${{ github.sha }} \
            ./bng-metric-backend

      - name: Start Docker Compose stack
        env:
          BNG_METRIC_FRONTEND_TAG: ${{ github.sha }}
          BNG_METRIC_BACKEND_TAG: ${{ github.sha }}
          BNG_METRIC_BACKEND_PATH: ./bng-metric-backend
        run: docker compose up --wait --wait-timeout 120 -d

      - name: Add host entries for identity stub
        run: echo "127.0.0.1 cdp-defra-id-stub" | sudo tee -a /etc/hosts

      # Every spec runs in both template runs, so a profile that selects no
      # tests is a mistake, such as a mistyped tag, and fails the run.
      - name: Run Playwright tests
        env:
          PROFILE: ${{ inputs.profile }}
        run: npm run test:github

      - name: Collect Docker Compose logs
        if: always()
        run: docker compose logs > logs.txt

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.run }}
          path: ./playwright-report

      - name: Upload Docker Compose logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs-${{ matrix.run }}
          path: ./logs.txt

  # One check for every run, under the name the single job had, so a rule that
  # requires "Run Journey Tests" needs no change and covers whichever runs ran. It runs
  # even when a run fails or is skipped, and passes only when every job it
  # needs succeeded: a bad template-run fails parse-depends-on and skips
  # run-tests, and a skipped job would otherwise satisfy a required check.
  all-runs:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    needs: [parse-depends-on, run-tests]
    if: always()
    steps:
      - name: Check every run passed
        env:
          RESULTS: ${{ needs.parse-depends-on.result }} ${{ needs.run-tests.result }}
        run: |
          echo "Resolve branch dependencies, then the template runs: $RESULTS"
          if [ "$RESULTS" != "success success" ]; then
            echo "::error::Every journey run must pass ($RESULTS)"
            exit 1
          fi
